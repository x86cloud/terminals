name: Build Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------- Windows --------------------
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows app
        run: wails build -clean -webview2 download

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xClient-windows-amd64
          path: build/bin/xClient.exe
          if-no-files-found: error

  # -------------------- macOS --------------------
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS app (universal, unsigned)
        run: wails build -clean -platform darwin/universal

      - name: Zip .app bundle
        run: ditto -c -k --keepParent build/bin/xClient.app build/bin/xClient-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xClient-macos-universal
          path: build/bin/xClient-macos-universal.zip
          if-no-files-found: error

  # -------------------- macOS (arm64) --------------------
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS app (arm64, unsigned)
        run: wails build -clean -platform darwin/arm64

      - name: Zip .app bundle
        run: ditto -c -k --keepParent build/bin/xClient.app build/bin/xClient-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xClient-macos-arm64
          path: build/bin/xClient-macos-arm64.zip
          if-no-files-found: error

  # -------------------- Release --------------------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/xClient-windows-amd64/xClient.exe
            artifacts/xClient-macos-universal/xClient-macos-universal.zip
            artifacts/xClient-macos-arm64/xClient-macos-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
