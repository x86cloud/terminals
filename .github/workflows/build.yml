name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Wails v3 CLI and Task
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build Windows Binary with Wails3
        run: |
          wails3 build

      - name: Package Windows MSI Installer (5-Step Wizard)
        shell: pwsh
        run: |
          ./scripts/build-msi.ps1

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-v3-windows-msi
          path: dist/*.msi
          if-no-files-found: error

  build-macos:
    name: Build macOS DMG (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Wails v3 CLI, Task, and create-dmg
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.10
          go install github.com/go-task/task/v3/cmd/task@latest
          brew install create-dmg || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build & Package macOS App with Wails3
        run: |
          wails3 build
          wails3 task darwin:package || wails3 package

      - name: Package macOS DMG Image
        run: |
          chmod +x ./scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-v3-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows MSI Artifact
        uses: actions/download-artifact@v4
        with:
          name: terminal-v3-windows-msi
          path: release-assets

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: terminal-v3-macos-dmg
          path: release-assets

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
